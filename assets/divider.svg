<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="20" viewBox="0 0 1000 20" fill="none">
  <defs>
    <linearGradient id="div-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0"/>
      <stop offset="25%" stop-color="#30363d" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#30363d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base Line -->
  <line x1="50" y1="10" x2="950" y2="10" stroke="url(#div-grad)" stroke-width="1.2"/>

  <!-- Traveling Glowing Dot -->
  <circle cy="10" r="5" fill="#39d0d8" opacity="0.3">
    <animate attributeName="cx" from="60" to="940" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cy="10" r="2.5" fill="#58a6ff">
    <animate attributeName="cx" from="60" to="940" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
