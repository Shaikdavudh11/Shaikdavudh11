<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" fill="none">
  
    <!-- Card: Declarative -->
    <g transform="translate(20, 15)">
      <!-- Pulsing Border Card Background -->
      <rect width="225" height="140" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2">
        <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="3s" repeatCount="indefinite" begin="0s"/>
        <animate attributeName="stroke-width" values="1.2;1.8;1.2" dur="3s" repeatCount="indefinite" begin="0s"/>
      </rect>

      <!-- Accent Top Badge -->
      <circle cx="28" cy="28" r="14" fill="#58a6ff" fill-opacity="0.12"/>
      <g transform="translate(16, 16)" stroke="#58a6ff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                       <path d="M9 10l-2 2 2 2m6-4l2 2-2 2"/>
      </g>

      <!-- Card Title -->
      <text x="52" y="33" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3">
        Declarative
      </text>

      <!-- Card Description -->
      <text x="20" y="76" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#8b949e">
        Infrastructure as code via Terraform.
      </text>
      <text x="20" y="96" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#8b949e">
        Git as the single source of truth.
      </text>

      <!-- Mini Indicator Pill -->
      <rect x="20" y="114" width="36" height="4" rx="2" fill="#58a6ff" fill-opacity="0.6"/>
    </g>

    <!-- Card: Observable -->
    <g transform="translate(265, 15)">
      <!-- Pulsing Border Card Background -->
      <rect width="225" height="140" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2">
        <animate attributeName="stroke" values="#30363d;#39d0d8;#30363d" dur="3s" repeatCount="indefinite" begin="0.75s"/>
        <animate attributeName="stroke-width" values="1.2;1.8;1.2" dur="3s" repeatCount="indefinite" begin="0.75s"/>
      </rect>

      <!-- Accent Top Badge -->
      <circle cx="28" cy="28" r="14" fill="#39d0d8" fill-opacity="0.12"/>
      <g transform="translate(16, 16)" stroke="#39d0d8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                       <circle cx="12" cy="12" r="3"/>
      </g>

      <!-- Card Title -->
      <text x="52" y="33" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3">
        Observable
      </text>

      <!-- Card Description -->
      <text x="20" y="76" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#8b949e">
        SLO-driven metrics, unified logging,
      </text>
      <text x="20" y="96" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#8b949e">
        and actionable distributed tracing.
      </text>

      <!-- Mini Indicator Pill -->
      <rect x="20" y="114" width="36" height="4" rx="2" fill="#39d0d8" fill-opacity="0.6"/>
    </g>

    <!-- Card: Self-healing -->
    <g transform="translate(510, 15)">
      <!-- Pulsing Border Card Background -->
      <rect width="225" height="140" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2">
        <animate attributeName="stroke" values="#30363d;#3fb950;#30363d" dur="3s" repeatCount="indefinite" begin="1.5s"/>
        <animate attributeName="stroke-width" values="1.2;1.8;1.2" dur="3s" repeatCount="indefinite" begin="1.5s"/>
      </rect>

      <!-- Accent Top Badge -->
      <circle cx="28" cy="28" r="14" fill="#3fb950" fill-opacity="0.12"/>
      <g transform="translate(16, 16)" stroke="#3fb950" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
      </g>

      <!-- Card Title -->
      <text x="52" y="33" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3">
        Self-healing
      </text>

      <!-- Card Description -->
      <text x="20" y="76" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#8b949e">
        Automated recovery, resilient pod
      </text>
      <text x="20" y="96" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#8b949e">
        lifecycles, and auto-scaling.
      </text>

      <!-- Mini Indicator Pill -->
      <rect x="20" y="114" width="36" height="4" rx="2" fill="#3fb950" fill-opacity="0.6"/>
    </g>

    <!-- Card: Evidence-first -->
    <g transform="translate(755, 15)">
      <!-- Pulsing Border Card Background -->
      <rect width="225" height="140" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2">
        <animate attributeName="stroke" values="#30363d;#a371f7;#30363d" dur="3s" repeatCount="indefinite" begin="2.25s"/>
        <animate attributeName="stroke-width" values="1.2;1.8;1.2" dur="3s" repeatCount="indefinite" begin="2.25s"/>
      </rect>

      <!-- Accent Top Badge -->
      <circle cx="28" cy="28" r="14" fill="#a371f7" fill-opacity="0.12"/>
      <g transform="translate(16, 16)" stroke="#a371f7" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                       <path d="M9 12l2 2 4-4"/>
      </g>

      <!-- Card Title -->
      <text x="52" y="33" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3">
        Evidence-first
      </text>

      <!-- Card Description -->
      <text x="20" y="76" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#8b949e">
        Zero-hallucination diagnostics
      </text>
      <text x="20" y="96" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#8b949e">
        grounded in real system telemetry.
      </text>

      <!-- Mini Indicator Pill -->
      <rect x="20" y="114" width="36" height="4" rx="2" fill="#a371f7" fill-opacity="0.6"/>
    </g>
</svg>
